<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4a3fd1">
<title>Practice Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script>try{var t=localStorage.getItem("qp_theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>
<header class="appbar">
  <button class="iconbtn burger" data-sheet="menu" aria-label="Open menu" title="Menu">
    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
  </button>
  <h1>Practice Hub</h1>
  <nav class="tabs" id="tabs">
    <button data-go="courses" class="active">Courses</button>
    <button data-go="practice">Practice</button>
  </nav>
  <div class="timer" id="timer" hidden role="timer" aria-label="Elapsed time"><i></i><span id="tval">00:00</span></div>
  <button class="theme" id="theme" data-theme-toggle aria-label="Switch light or dark theme"></button>
</header>

<aside class="drawer" id="menu" aria-label="Menu">
  <div class="palhead"><b>Menu</b><button class="iconbtn" data-closesheet aria-label="Close menu">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
  <button class="mi active" data-go="courses">Courses</button>
  <button class="mi" data-go="practice">Practice</button>
</aside>
<div id="scrim"></div>

<main id="app"></main>

<dialog id="dlg">
  <form id="addForm" method="dialog">
    <h2>Add course</h2>
    <label class="field"><span>Course name</span><input id="cname" required maxlength="80" placeholder="e.g. Cyber Physical Systems"></label>
    <label class="file"><span>Questions file (cache JSON)</span><input id="f1" type="file" accept=".json,application/json" required></label>
    <label class="file"><span>Answers file (correct JSON)</span><input id="f2" type="file" accept=".json,application/json" required></label>
    <p class="err" id="err" role="alert"></p>
    <div class="actions">
      <button type="button" class="btn text" id="cancel">Cancel</button>
      <button type="submit" class="btn filled">Save course</button>
    </div>
  </form>
</dialog>
<dialog id="sdlg">
  <h2>Start practice?</h2>
  <p id="smsg" class="sub"></p>
  <div class="seg" role="radiogroup" aria-label="Question order">
    <label><input type="radio" name="mode" value="full" checked><span>Full random</span></label>
    <label><input type="radio" name="mode" value="week"><span>Week-wise shuffle</span></label>
  </div>
  <p id="mdesc" class="mdesc"></p>
  <div class="actions"><button class="btn text" data-scancel>Cancel</button><button class="btn filled" data-sstart>Start practice</button></div>
</dialog>
<!-- confirmation popup (replaces browser confirm()) -->
<dialog id="cdlg">
  <form method="dialog">
    <h2 id="ctitle"></h2>
    <p id="cmsg" class="sub"></p>
    <div class="actions"><button class="btn text" value="no">Cancel</button><button class="btn filled" id="cyes" value="yes">OK</button></div>
  </form>
</dialog>
<!-- toast -->
<div id="snack" class="snack" role="status" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
