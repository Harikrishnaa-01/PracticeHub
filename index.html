<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4a3fd1">
<title>Practice Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script>try{var t=localStorage.getItem("qp_theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>
<header class="appbar">
  <h1><button class="brand" data-go="courses" title="Home">Practice Hub</button></h1>
  <div class="timer" id="timer" hidden role="timer" aria-label="Elapsed time"><i></i><span id="tval">00:00</span></div>
  <button class="btn quit" id="quit" data-quit hidden aria-label="Quit test">Quit</button>
  <button class="theme" id="theme" data-theme-toggle aria-label="Switch light or dark theme"></button>
</header>
<div id="scrim"></div>

<main id="app"></main>

<dialog id="dlg">
  <form id="addForm" method="dialog">
    <h2>Add course</h2>
    <label class="field"><span>Course name</span><input id="cname" required maxlength="80" placeholder="e.g. Cyber Physical Systems"></label>
    <label class="file"><span>Questions and answers files</span>
      <input id="files" type="file" accept=".json,application/json" multiple required>
      <small class="fhint">Select both JSON files together (Ctrl/Cmd-click, or drag both in). Exactly two files; the order doesn't matter.</small></label>
    <ul class="fstat" id="fstat" aria-live="polite"></ul>
    <p class="err" id="err" role="alert"></p>
    <div class="actions">
      <button type="button" class="btn text" id="cancel">Cancel</button>
      <button type="submit" class="btn filled">Save course</button>
    </div>
  </form>
</dialog>
<dialog id="sdlg">
  <h2>Start practice?</h2>
  <p id="smsg" class="sub"></p>
  <div class="seg" role="radiogroup" aria-label="Question order">
    <label><input type="radio" name="mode" value="full" checked><span>Full random</span></label>
    <label><input type="radio" name="mode" value="week"><span>Week-wise shuffle</span></label>
  </div>
  <p id="mdesc" class="mdesc"></p>
  <div class="actions"><button class="btn text" data-scancel>Cancel</button><button class="btn filled" data-sstart>Start practice</button></div>
</dialog>
<dialog id="rdlg">
  <form id="renForm" method="dialog">
    <h2>Rename course</h2>
    <label class="field"><span>Course name</span><input id="rname" required maxlength="80"></label>
    <p class="err" id="rerr" role="alert"></p>
    <div class="actions"><button type="button" class="btn text" id="rcancel">Cancel</button><button type="submit" class="btn filled">Save</button></div>
  </form>
</dialog>
<div id="ctx" class="ctxmenu" role="menu" aria-label="Course options" hidden></div>
<!-- confirmation popup (replaces browser confirm()) -->
<dialog id="cdlg">
  <form method="dialog">
    <h2 id="ctitle"></h2>
    <p id="cmsg" class="sub"></p>
    <div class="actions"><button class="btn text" value="no">Cancel</button><button class="btn filled" id="cyes" value="yes">OK</button></div>
  </form>
</dialog>
<!-- toast -->
<div id="snack" class="snack" role="status" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
